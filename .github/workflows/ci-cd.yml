name: HRMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: naidusomineni
  BACKEND_IMAGE: ghcr.io/naidusomineni/hrms-backend
  FRONTEND_IMAGE: ghcr.io/naidusomineni/hrms-frontend

jobs:
  # ── Backend CI ────────────────────────────────────────────────────
  backend-ci:
    name: Backend — Java 21 & PostgreSQL Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres -d hrms_db" --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compile and Test
        working-directory: ./backend
        run: mvn test -B -e -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hrms_db
          DB_USERNAME: postgres
          DB_PASSWORD: testpassword
          FLYWAY_ENABLED: "false"
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

      - name: Build JAR Package
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

      - name: Build Backend Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -t ${{ env.BACKEND_IMAGE }}:latest ./backend

  # ── Frontend CI ───────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Node 20 & Vite Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Production Vite Bundle
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Build Frontend Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f frontend/Dockerfile -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -t ${{ env.FRONTEND_IMAGE }}:latest ./frontend
